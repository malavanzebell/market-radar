name: Market Radar News and Prices

on:
  schedule:
    # GitHub checks roughly every 5 min, actual start time is not guaranteed.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test Telegram, scan prices + news, or refresh only prices'
        required: true
        default: scan
        type: choice
        options:
          - test
          - scan
          - prices

permissions:
  contents: write

concurrency:
  group: market-radar-telegram-automation
  cancel-in-progress: false

jobs:
  market-radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test Telegram connection
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python market_radar.py --test

      - name: Update one daily price board
        if: github.event_name == 'schedule' || inputs.mode == 'scan' || inputs.mode == 'prices'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          PRICES_ENABLED: '1'
          PRICE_FRESH_MINUTES: '90'
        run: python market_radar.py --prices-once

      - name: Read and publish market news
        if: github.event_name == 'schedule' || inputs.mode == 'scan'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          PRICES_ENABLED: '0'
          MIN_SCORE: '5'
          MAX_AGE_HOURS: '24'
          MAX_ALERTS_PER_CYCLE: '0'
          MAX_DAILY_ALERTS: '0'
          MAX_CYCLE_SECONDS: '390'
          URGENT_RED_BUTTON: '1'
        run: python market_radar.py --once

      - name: Save news and price message history
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'scan' || inputs.mode == 'prices')
        run: |
          if [ -f market_radar.sqlite3 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f market_radar.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m 'chore: update news and price state [skip ci]'
              git push
            fi
          fi
